apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: knot
  namespace: knot
spec:
  serviceName: knot
  # Git is the knot's only database, on one local volume. There is no
  # clustering. Never scale up.
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: knot
  template:
    metadata:
      labels:
        app.kubernetes.io/name: knot
    spec:
      # Matches stop_grace_period in the upstream compose file. The knot drains
      # open SSH sessions and HTTP requests on SIGTERM.
      terminationGracePeriodSeconds: 90

      securityContext:
        runAsUser: 2357
        runAsGroup: 2357
        runAsNonRoot: true
        # Makes a fresh PVC writable by the knot user, and makes the host key
        # Secret readable by init-host-key.
        fsGroup: 2357
        # A recursive fsGroup pass would add group-rw to every file on the PVC.
        # OnRootMismatch skips it while the volume root already belongs to
        # group 2357, which the Go knot's init container and the migration
        # both leave in place.
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault

      initContainers:
        # The knot refuses to load a host key that is group- or
        # other-readable. fsGroup leaves Secret files at 0440, so copy the key
        # into an emptyDir at 0600. fsGroup only touches the emptyDir at mount
        # time, so the mode sticks.
        #
        # Also creates the repo and LFS dirs. The knot checks both exist and
        # are writable at start and will not create them. On a migrated volume
        # they already exist and this is a no-op.
        - name: init-host-key
          image: knot:v1.20.0
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -eu
              install -m 0600 /etc/knot/ssh-src/ssh_host_ed25519_key /etc/knot/ssh/ssh_host_key
              mkdir -p /data/knot2/repos /data/knot2/lfs
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: data
              mountPath: /data
            - name: ssh-host-key-src
              mountPath: /etc/knot/ssh-src
              readOnly: true
            - name: ssh-host-key
              mountPath: /etc/knot/ssh

      containers:
        - name: knot
          image: knot:v1.20.0
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: knot-server
            - secretRef:
                name: knot-master-key
          ports:
            - name: http
              containerPort: 5555
            - name: ssh
              containerPort: 2222

          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]

          # The knot sizes its caches and thread pool from the cgroup limit.
          # 2Gi matches the upstream compose example. Raise it for big repos.
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              memory: 2Gi

          volumeMounts:
            - name: data
              mountPath: /data
            - name: ssh-host-key
              mountPath: /etc/knot/ssh
              readOnly: true
            - name: tmp
              mountPath: /tmp

          # Kubernetes ignores the Dockerfile HEALTHCHECK. The knot rebuilds
          # its index from the meta-repo before it binds either port, so the
          # first start after a migration can be slow. This allows 10 minutes,
          # the same start period as the upstream image.
          #
          # One process serves both HTTP and SSH and binds them together, so
          # the HTTP health check covers SSH too. It also fails when the LFS
          # store is not writable.
          startupProbe:
            httpGet:
              path: /xrpc/_health
              port: http
            periodSeconds: 5
            failureThreshold: 120
          readinessProbe:
            httpGet:
              path: /xrpc/_health
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /xrpc/_health
              port: http
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3

      volumes:
        # The same Secret the Go knot's sshd used. Only the ed25519 key is
        # used. knot-migrate imports that one, so the fingerprint users already
        # trust stays the same.
        - name: ssh-host-key-src
          secret:
            secretName: knot-sshd-host-keys
            items:
              - key: ssh_host_ed25519_key
                path: ssh_host_ed25519_key
            defaultMode: 0440
        - name: ssh-host-key
          emptyDir:
            medium: Memory
            sizeLimit: 1Mi
        - name: tmp
          emptyDir:
            sizeLimit: 1Gi

  # Unchanged from the Go knot, so the StatefulSet can be updated in place and
  # keeps the same data-knot-0 PVC. volumeClaimTemplates are immutable.
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 20Gi
        # Uncomment and set if your default class is not what you want.
        # storageClassName: ""
