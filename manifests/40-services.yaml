apiVersion: v1
kind: Service
metadata:
  name: knot
  namespace: knot
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: knot
  ports:
    - name: http
      port: 5555
      targetPort: http
---
# Separate Service so ingress-nginx can target it from the tcp-services map.
# Kept ClusterIP: the controller's own LoadBalancer is what faces the internet.
#
# Port 22 maps to the container port named ssh. That is 2222 on the knot and
# was 22 on the Go knot's sshd, so this Service serves either one unchanged.
apiVersion: v1
kind: Service
metadata:
  name: knot-ssh
  namespace: knot
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: knot
  ports:
    - name: ssh
      port: 22
      targetPort: ssh
